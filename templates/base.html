<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khaira Mafia Hub</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Grandstander:wght@500&family=Inter:wght@400;600;700&family=Playfair+Display:ital@0;1&family=Poppins:wght@600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0e14; color: #f8f9fa; }
        h1, h2, h3, .navbar-brand { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary mb-4">
        <div class="container-fluid">
            <a class="navbar-brand text-warning fw-bold" href="{{ url_for('index') }}">🎩 Khaira Mafia</a>
            
            {% if current_user.is_authenticated %}
            <!-- Mobile Hamburger Toggle Button -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Collapsible Navigation Menu -->
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-2 py-2 py-lg-0">
                    <li class="nav-item"><a class="nav-link text-info fw-bold" href="{{ url_for('index') }}">🤖 AI Assistant</a></li>
                    <li class="nav-item"><a class="nav-link text-warning fw-bold" href="{{ url_for('poker') }}">♠️ Poker Lounge</a></li>
                    <li class="nav-item"><a class="nav-link text-success fw-bold" href="{{ url_for('ludo') }}">🎲 Ludo Arena</a></li>
                    <li class="nav-item"><a class="nav-link text-light fw-bold" href="{{ url_for('dm_inbox') }}">🔒 1-on-1 DM</a></li>
                    <li class="nav-item ms-lg-2"><a class="btn btn-outline-danger btn-sm w-100 w-lg-auto" href="{{ url_for('logout') }}">Logout</a></li>
                </ul>
            </div>
            {% endif %}
        </div>
    </nav>

    <div class="container-fluid">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap 5 JavaScript Bundle (Required for Mobile Hamburger Toggle) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
