<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Khaira Mafia HQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background-color: #1f2833;
            border: 1px solid #45a29e;
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.2);
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
        }

        .login-title {
            color: #66fcf1;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(102, 252, 241, 0.4);
        }

        .form-control {
            background-color: #0b0c10;
            border: 1px solid #45a29e;
            color: #ffffff;
        }

        .form-control:focus {
            background-color: #0b0c10;
            border-color: #66fcf1;
            color: #ffffff;
            box-shadow: 0 0 8px rgba(102, 252, 241, 0.5);
        }

        .btn-custom {
            background-color: #45a29e;
            color: #0b0c10;
            font-weight: 600;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-custom:hover {
            background-color: #66fcf1;
            color: #0b0c10;
            box-shadow: 0 0 12px rgba(102, 252, 241, 0.6);
        }

        .auth-link {
            color: #66fcf1;
            text-decoration: none;
        }

        .auth-link:hover {
            text-decoration: underline;
        }

        .alert-custom {
            background-color: rgba(255, 77, 77, 0.15);
            border: 1px solid #ff4d4d;
            color: #ff4d4d;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h3 class="text-center login-title mb-4">Khaira Mafia HQ</h3>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-custom alert-dismissible fade show text-center" role="alert">
                {{ message }}
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <!-- Login Form -->
        <form action="{{ url_for('login') }}" method="POST">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required autocomplete="username">
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-custom w-100 py-2 mb-3">Log In</button>
        </form>

        <div class="text-center mt-3">
            <small>Don't have an account? <a href="{{ url_for('register') }}" class="auth-link">Register here</a></small>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
