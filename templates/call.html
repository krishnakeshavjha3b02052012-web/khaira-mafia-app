{% extends 'base.html' %}
{% block content %}
<div class="container py-2">
    <h3 class="text-danger mb-3"><i class="bi bi-telephone-fill"></i> HQ Secure Voice & Video Room</h3>
    <div id="meet" style="width: 100%; height: 75vh; border-radius: 10px; overflow: hidden;"></div>
</div>
<script src="https://meet.jit.si/external_api.js"></script>
<script>
    const domain = 'meet.jit.si';
    const options = {
        roomName: 'KhairaMafiaHQ_Secure_Channel',
        width: '100%',
        height: '100%',
        parentNode: document.querySelector('#meet'),
        userInfo: { displayName: "{{ current_user.username }}" }
    };
    const api = new JitsiMeetExternalAPI(domain, options);
</script>
{% endblock %}
