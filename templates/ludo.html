{% extends "base.html" %}
{% block content %}
<style>
    .ludo-container { background-color: #0d1117; min-height: 85vh; border-radius: 15px; padding: 20px; }
    .ludo-board { width: 420px; height: 420px; display: grid; grid-template-columns: repeat(15, 1fr); grid-template-rows: repeat(15, 1fr); gap: 1px; background-color: #222; border: 8px solid #333; border-radius: 12px; margin: 0 auto; }
    .base-red { grid-column: 1 / 7; grid-row: 1 / 7; background-color: #dc3545; }
    .base-green { grid-column: 10 / 16; grid-row: 1 / 7; background-color: #198754; }
    .base-yellow { grid-column: 10 / 16; grid-row: 10 / 16; background-color: #ffc107; }
    .base-blue { grid-column: 1 / 7; grid-row: 10 / 16; background-color: #0d6efd; }
    .center-home { grid-column: 7 / 10; grid-row: 7 / 10; background: conic-gradient(#dc3545 0 90deg, #198754 90deg 180deg, #ffc107 180deg 270deg, #0d6efd 270deg 360deg); }
    .dice-display { font-size: 3rem; width: 80px; height: 80px; line-height: 80px; background-color: #1f2833; border: 2px solid #66fcf1; border-radius: 12px; margin: 0 auto; }
</style>
<div class="container-fluid ludo-container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="text-success mb-0">🎲 Khaira Mafia Ludo Arena</h3>
        <div class="bg-dark p-2 rounded border border-secondary">Active Turn: <strong id="current-player" class="text-danger">Red Player</strong></div>
    </div>
    <div class="row align-items-center my-3">
        <div class="col-lg-8 text-center mb-4 mb-lg-0">
            <div class="ludo-board">
                <div class="base-red d-flex align-items-center justify-content-center">🔴🔴</div>
                <div class="base-green d-flex align-items-center justify-content-center">🟢🟢</div>
                <div class="center-home"></div>
                <div class="base-blue d-flex align-items-center justify-content-center">🔵🔵</div>
                <div class="base-yellow d-flex align-items-center justify-content-center">🟡🟡</div>
            </div>
        </div>
        <div class="col-lg-4 text-center">
            <div class="card bg-dark border-secondary p-4">
                <h5 class="text-info mb-3">Operations Dice</h5>
                <div id="dice-box" class="dice-display text-warning mb-3">🎲</div>
                <button id="roll-btn" class="btn btn-success btn-lg w-100 fw-bold mb-3" onclick="rollDice()">🎲 ROLL DICE</button>
                <div id="status-log" class="text-light small p-2 bg-black rounded border border-secondary">Red player rolls first.</div>
            </div>
        </div>
    </div>
</div>
<script>
    const players = [{ name: 'Red Player', class: 'text-danger' }, { name: 'Green Player', class: 'text-success' }, { name: 'Yellow Player', class: 'text-warning' }, { name: 'Blue Player', class: 'text-primary' }];
    const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
    let turnIndex = 0;
    function rollDice() {
        let rolls = 0;
        const interval = setInterval(() => {
            document.getElementById('dice-box').innerText = diceFaces[Math.floor(Math.random() * 6)];
            rolls++;
            if (rolls >= 10) {
                clearInterval(interval);
                const val = Math.floor(Math.random() * 6) + 1;
                document.getElementById('dice-box').innerText = diceFaces[val - 1];
                document.getElementById('status-log').innerText = `${players[turnIndex].name} rolled a ${val}!`;
                if (val !== 6) {
                    turnIndex = (turnIndex + 1) % players.length;
                    document.getElementById('current-player').innerText = players[turnIndex].name;
                    document.getElementById('current-player').className = players[turnIndex].class;
                }
            }
        }, 80);
    }
</script>
{% endblock %}
