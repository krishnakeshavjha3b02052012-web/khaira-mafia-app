<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members Directory | Khaira Mafia HQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0c10; color: #c5c6c7; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #1f2833; border: 1px solid #45a29e; border-radius: 10px; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #66fcf1; object-fit: cover; }
        .btn-custom { background-color: #45a29e; color: #0b0c10; font-weight: bold; }
        .btn-custom:hover { background-color: #66fcf1; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-info fw-bold"><i class="fa-solid fa-users me-2"></i>HQ Member Directory</h2>
        <a href="{{ url_for('index') }}" class="btn btn-outline-info">Back to Dashboard</a>
    </div>

    <div class="row g-4">
        {% for m in members %}
        <div class="col-md-6 col-lg-4">
            <div class="card p-4 text-center h-100">
                <img src="{{ m.pfp_url }}" class="avatar mx-auto mb-3" alt="{{ m.username }}">
                <h4 class="text-white fw-bold mb-1">{{ m.username }}</h4>
                <span class="badge bg-secondary w-auto mx-auto mb-3">{{ m.role }}</span>
                <p class="text-muted small"><i class="fa-solid fa-location-dot me-1 text-info"></i>{{ m.address }}</p>
                {% if m.id != current_user.id %}
                <a href="{{ url_for('private_chat', user_id=m.id) }}" class="btn btn-custom mt-auto"><i class="fa-solid fa-envelope me-1"></i> Direct Message</a>
                {% else %}
                <a href="{{ url_for('profile') }}" class="btn btn-outline-light mt-auto"><i class="fa-solid fa-pen me-1"></i> Edit Profile</a>
                {% endif %}
            </div>
        </div>
        {% endfor %}
    </div>
</div>

</body>
</html>
