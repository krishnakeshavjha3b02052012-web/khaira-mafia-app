<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | Khaira Mafia HQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0c10; color: #c5c6c7; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; display: flex; align-items: center; }
        .card { background-color: #1f2833; border: 1px solid #45a29e; max-width: 500px; width: 100%; }
        .form-control { background-color: #0b0c10; border: 1px solid #45a29e; color: #fff; }
        .form-control:focus { background-color: #0b0c10; color: #fff; border-color: #66fcf1; box-shadow: none; }
        .btn-custom { background-color: #66fcf1; color: #0b0c10; font-weight: bold; }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="card p-4 shadow-lg rounded-3">
        <h3 class="text-info text-center fw-bold mb-4">Edit Profile</h3>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-info text-center">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('profile') }}" method="POST">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" value="{{ current_user.username }}" disabled>
            </div>
            <div class="mb-3">
                <label class="form-label">Profile Picture Image URL (PFP)</label>
                <input type="url" name="pfp_url" class="form-control" value="{{ current_user.pfp_url }}" placeholder="https://example.com/avatar.jpg">
            </div>
            <div class="mb-4">
                <label class="form-label">Address / Location</label>
                <input type="text" name="address" class="form-control" value="{{ current_user.address }}" placeholder="e.g. Sector 4, HQ City">
            </div>
            <button type="submit" class="btn btn-custom w-100 mb-2">Save Profile</button>
            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary w-100">Cancel</a>
        </form>
    </div>
</div>

</body>
</html>
